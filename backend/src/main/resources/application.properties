spring.application.name=risco-urbano
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${RISCO_DB_URL:jdbc:h2:file:./data/risco-urbano}
spring.datasource.username=${RISCO_DB_USER:sa}
spring.datasource.password=${RISCO_DB_PASSWORD:}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
